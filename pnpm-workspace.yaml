packages:
  - '.'

# Third-party packages must be at least this old before install will take them. It is a
# supply-chain control: a malicious version published an hour ago is the shape most registry
# attacks take, and none of them survive a week. Copied from micro/runtime deliberately —
# a harness that gates releases is itself a supply-chain target.
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@cloudsforge/*'

# Omitting this makes install rewrite the file with placeholders.
allowBuilds:
  esbuild: false
strictDepBuilds: false
